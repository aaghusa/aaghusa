<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>usa</title>
  <style>
    /* Minimal, SANAA-like: centered text blocks in a tall white field */
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #fff;
      color: #000;
      /* SANAA looks close to default serif; force a classic serif stack */
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      line-height: 1.25;
    }

    /* A full-height stage where we place two “bands” */
    .stage {
      height: 100vh;
      position: relative;
    }

    /* Centered blocks */
    .center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 980px;
      text-align: center;
      white-space: nowrap; /* keeps the title on one line like SANAA */
    }

    /* Approximate vertical placement from the screenshot */
    .title {
      top: 38%;
      font-size: 16px;
    }

    .contact {
      top: 58%;
      font-size: 12px;
      line-height: 1.3;
      white-space: normal; /* allow wrapping for the long contact line */
    }

    a {
      color: inherit;
      text-decoration: none; /* SANAA looks like plain text */
    }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }

    /* Mobile: allow title to wrap if needed */
    @media (max-width: 520px) {
      .title { white-space: normal; }
      .title { font-size: 15px; }
      .contact { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="center title">
      Alexei Haddad / u s a
    </div>

    <div class="center contact">
      If you would like to contact us, please send an e-mail to:
      <a href="mailto:hello@usa.consulting">hello@usa.consulting</a>
      &nbsp;|&nbsp;
      <a href="mailto:press@usa.consulting">press@usa.consulting</a>
      &nbsp;|&nbsp;
      <a href="mailto:work@usa.consulting">work@usa.consulting</a>
    </div>
  </div>
</body>
</html>
